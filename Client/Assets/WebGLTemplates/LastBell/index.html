<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a27"><meta name="description" content="금빛 공격 예고를 읽고, 파동이 맞닿는 순간 회피하세요. 마지막 종지기 20스테이지 프로토타입."><title>마지막 종지기 · 플레이테스트</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#101a27;color:#e9e0ce;font:16px/1.6 system-ui,sans-serif;height:100%}main{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:18px max(12px,env(safe-area-inset-left)) 12px}header{width:min(100%,1100px);display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}h1{font-size:23px;letter-spacing:-.03em;margin:0}small,.muted{color:#aab9c9}.badge{font-size:12px;color:#e9b85a;letter-spacing:.12em}button{font:inherit;background:#e9b85a;color:#142336;border:0;border-radius:5px;padding:10px 20px;min-height:44px;cursor:pointer}button:focus-visible{outline:3px solid #9ee3d4;outline-offset:3px}button.secondary{background:#21364b;color:#eee1c7;border:1px solid #647587;padding:8px 15px}button:disabled{opacity:.5;cursor:default}#stage{position:relative;width:min(1100px,100%,calc((100svh - 165px)*16/9));aspect-ratio:16/9;background:#0a1420;border:1px solid #344b62;overflow:hidden}canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}#cover{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#243e59,#0e1c2c 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}#cover h2{font-size:clamp(22px,4vw,42px);margin:0 0 10px}#cover p{margin:0 0 20px;color:#c2ced8;max-width:520px}#status{min-height:26px}progress{width:min(320px,80%);height:8px;accent-color:#e9b85a;margin:10px 0}#loading{display:none}#error{color:#ffccbd;white-space:pre-line}footer{max-width:1000px;text-align:center;font-size:13px;margin-top:12px}kbd{display:inline-block;min-width:22px;border:1px solid #647587;border-radius:3px;padding:0 4px;background:#1d3043;color:#eee1c7}#stage:fullscreen{width:100vw;height:100vh;border:0;aspect-ratio:auto;background:#101a27}#stage:fullscreen canvas{object-fit:contain}#turn{display:none}@media(max-width:680px){main{padding-top:10px}h1{font-size:18px}.badge{font-size:10px}footer{font-size:12px}#stage{width:100%}}@media(orientation:landscape) and (max-height:500px){main{padding:0}header,footer{display:none}#stage{width:100vw;height:100svh;border:0;aspect-ratio:auto}}@media(orientation:portrait) and (max-width:680px){#turn{display:block;color:#e9b85a;margin:8px 0}}
</style></head><body><main><header><div><div class="badge">LAST BELL · PROTOTYPE</div><h1>마지막 종지기</h1></div><button class="secondary" id="fullscreen" disabled>전체 화면</button></header><section id="stage" aria-label="마지막 종지기 게임"><canvas id="game" width="960" height="540" tabindex="0" aria-label="방향키로 회피하고 Space로 공격하는 게임"></canvas><div id="cover"><div class="badge">STAGE 1 — 20</div><h2>파동이 맞닿는 순간, 회피.</h2><p>금빛 영역을 읽고 네 방향으로 대응하세요.<br>20스테이지를 클리어하면 이번 도전이 끝납니다.</p><button id="start">게임 시작</button><div id="loading"><div id="status" role="status">게임을 불러오는 중…</div><progress id="progress" max="1" value="0"></progress></div><div id="error" role="alert"></div></div></section><footer><div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 방향키 · 회피　<kbd>Space</kbd> · 공격　<kbd>Esc</kbd> · 일시정지</div><div class="muted">↓ / S는 상단 공격을 검으로 쳐내며 회피합니다. 10스테이지 클리어 후 재도전은 11스테이지부터 · 재화와 강화는 이 브라우저에 저장됩니다.</div><div><a href="StreamingAssets/AudioLicenses/CREDITS.txt" target="_blank" rel="noopener" style="color:#e9b85a">음원 출처 · 라이선스</a></div><div id="turn">휴대폰은 가로로 돌려서 플레이해 주세요.</div></footer></main>
<script>
const $=id=>document.getElementById(id);let game=null,loading=false;
$('fullscreen').onclick=()=>{if(game){game.SetFullscreen(1);$('game').focus();}};
$('start').onclick=async()=>{if(loading)return;loading=true;$('start').hidden=true;$('loading').style.display='block';$('error').textContent='';
 const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';
 const fail=()=>{loading=false;$('loading').style.display='none';$('start').hidden=false;$('start').textContent='다시 불러오기';$('error').textContent='게임을 불러오지 못했습니다.\n연결을 확인하고 다시 시도해 주세요.';};script.onerror=fail;
 script.onload=()=>createUnityInstance($('game'),{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'{{{ COMPANY_NAME }}}',productName:'{{{ PRODUCT_NAME }}}',productVersion:'{{{ PRODUCT_VERSION }}}',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)},p=>{$('progress').value=p;$('status').textContent='게임을 불러오는 중… '+Math.round(p*100)+'%';}).then(instance=>{game=instance;$('cover').hidden=true;$('cover').style.display='none';$('fullscreen').disabled=false;$('game').focus();}).catch(error=>{console.error(error);fail();});document.body.appendChild(script);
};
$('game').addEventListener('pointerdown',()=>{$('game').focus();});document.addEventListener('keydown',e=>{if(game&&document.activeElement===$('game')&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
</script></body></html>
