<main><div class="tag">LAST BELL · WINDOWS BUILD · COMBAT v5.5</div><h1>금빛 예고, 완벽 회피, 즉시 반격</h1>
<p class="muted">아래는 실제 Windows 실행본에서 20ms 간격으로 캡처한 장면입니다. 앞 영역 3회 → 뒤 영역 3회 → 두 번의 공격 → 완벽 회피 후 공격 입력을 재생합니다. 이 기록은 무음입니다.</p>
<p><a href="../../../Builds/Windows/LastBellMvp.exe">Windows 실행 파일</a> · <a href="../../../Builds/LastBellMvp-Windows.zip">Windows ZIP</a> · <a href="verification.json">검증 기록</a> · <a href="../../Presentation/feedback-plan-v55.html">v5.5 기획 보드</a></p>
<img id="movie" src="960/combo-000.png" alt="실제 게임의 금빛 연타 예고와 완벽 회피 반격">
<div class="controls"><button id="play">일시정지</button><select id="size" aria-label="화면 크기"><option value="960">960 × 540</option><option value="640">640 × 360</option><option value="wide">1280 × 540</option></select><select id="speed" aria-label="재생 속도"><option value="1">1배속</option><option value="0.5">0.5배속</option><option value="0.25">0.25배속</option></select><span class="time" id="clock">0 ms</span></div>
<input id="seek" type="range" min="0" max="105" value="0" aria-label="재생 위치">
<div class="controls"><button data-frame="0">앞 예고</button><button data-frame="27">뒤 예고</button><button data-frame="55">첫 발사</button><button data-frame="59">첫 완벽 회피</button><button data-frame="75">둘째 완벽 회피</button><button data-frame="80">복귀 후 접근</button><button data-frame="90">반격 명중</button></div>
<section><h2>화면 중앙에서 바깥까지</h2><div class="grid"><figure><img src="960/wave-center.png" alt="화면 정중앙에서 같은 가로 세로 반지름으로 확산하는 파동"><figcaption>캐릭터와 분리된 화면 중심 · 청록/크림 원형 고리 두 겹</figcaption></figure><figure><img src="wide/wave-center.png" alt="넓은 화면 중앙의 원형 파동"><figcaption>넓은 화면에서도 뷰포트 정중앙 유지</figcaption></figure></div></section>
<section><h2>네 방향의 위험 영역</h2><div class="grid"><figure><img src="960/shape-2-bright.png" alt="창 찌르기의 사각형 예고"><figcaption>창 찌르기 · 몬스터 앞에서 캐릭터까지</figcaption></figure><figure><img src="960/shape-1-bright.png" alt="낮은 공격의 사각형 예고"><figcaption>낮은 휩쓸기 · 발밑 위험</figcaption></figure><figure><img src="960/shape-3-bright.png" alt="높은 공격의 사각형 예고"><figcaption>높은 휩쓸기 · 머리 높이 위험</figcaption></figure><figure><img src="960/shape-4-bright.png" alt="후방 내려치기의 사각형 예고"><figcaption>후방 내려치기 · 뒤쪽 위험</figcaption></figure></div></section>
<section><h2>몬스터 공격과 연출 줄이기</h2><div class="grid"><figure><img src="960/shape-4-flight.png" alt="후방으로 떨어지는 무기 궤적"><figcaption>방향별 무기 궤적 · 접촉 파편과 지면 파문</figcaption></figure><figure><img src="640/reduced-static-wave.png" alt="작은 화면의 정적 완벽 회피 문양"><figcaption>연출 줄이기 · 정적 문양, 파편과 흔들림 제거</figcaption></figure></div></section></main>
<script>
const movie=document.getElementById('movie'),play=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.getElementById('clock'),size=document.getElementById('size'),speed=document.getElementById('speed');
let running=true,time=0,last=performance.now(),frame=-1;
function show(n){n=Math.max(0,Math.min(105,n));if(n!==frame){frame=n;movie.src=`${size.value}/combo-${String(n).padStart(3,'0')}.png`;seek.value=n;clock.textContent=`${n*20} ms`;}}
function toggle(value){running=value;play.textContent=value?'일시정지':'재생';}
play.onclick=()=>toggle(!running);seek.oninput=()=>{toggle(false);time=+seek.value*20;show(+seek.value);};
size.onchange=()=>{frame=-1;show(Math.floor(time/20));};
document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{toggle(false);time=+b.dataset.frame*20;show(+b.dataset.frame);});
function tick(now){if(running){time=(time+(now-last)*+speed.value)%2400;show(Math.min(105,Math.floor(time/20)));}last=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
