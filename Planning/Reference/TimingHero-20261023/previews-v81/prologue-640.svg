"1" /><rect x="55" y="57" width="14" height="37" fill="#ffdc83" stroke="none" stroke-width="1" /><text x="320" y="62" font-size="21" fill="#674823" text-anchor="middle" >마지막 불씨</text><defs><clipPath id="story"><rect x="117" y="87" width="406" height="164"/></clipPath></defs><g clip-path="url(#story)"><text x="320" y="91.39999999999998" font-size="17" fill="#513e2a" text-anchor="middle" >종소리가 멎자,</text><text x="320" y="119.39999999999998" font-size="17" fill="#513e2a" text-anchor="middle" >마을의 등불이 꺼졌습니다.</text><text x="320" y="185.39999999999998" font-size="17" fill="#513e2a" text-anchor="middle" >어둠 속에 잠든 사람들은</text><text x="320" y="213.39999999999998" font-size="17" fill="#513e2a" text-anchor="middle" >아침을 기다리고 있습니다.</text><text x="320" y="279.4" font-size="17" fill="#513e2a" text-anchor="middle" >당신은 마지막 불씨를 지닌 종지기.</text><text x="320" y="307.4" font-size="17" fill="#513e2a" text-anchor="middle" >꺼진 등불을 밝히고 다섯 종을 깨우세요.</text><text x="320" y="373.4" font-size="17" fill="#513e2a" text-anchor="middle" >성문 너머, 첫 번째 종이 있습니다.</text><text x="320" y="401.4" font-size="17" fill="#513e2a" text-anchor="middle" >이제 당신의 여정이 시작됩니다.</text></g><g role="button" tabindex="0" aria-label="건너뛰기" data-action="skip" data-enabled="true" opacity="1"><rect x="472" y="296" width="144" height="48" fill="#182d40" stroke="#456077" stroke-width="2" /><text x="544" y="326.3" font-size="18" fill="#ffe1a0" text-anchor="middle" >건너뛰기</text></g></g></svg>