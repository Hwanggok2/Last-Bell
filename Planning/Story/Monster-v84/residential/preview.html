<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주거구 몬스터 · v8.4 모션 검수</title>
<style>body{margin:0;background:#0c1822;color:#e6dfca;font:16px/1.6 system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:32px 20px}h1{font-size:26px}p{color:#a4b7b9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}article{border:1px solid #34505b;background:#14252f;padding:18px}h2{font-size:20px;color:#d4a04a;margin:0}.scene{height:290px;display:grid;place-items:center;background:linear-gradient(#13212b,#203a42);border-bottom:3px solid #34505b;margin:14px 0;overflow:hidden}canvas{width:384px;height:288px;image-rendering:pixelated;max-width:100%;object-fit:contain}button{background:#263e48;color:#f4e4bd;border:1px solid #58747b;padding:8px 11px;margin:2px;cursor:pointer}button.active{background:#84602d;border-color:#d4a04a}.frame{font-variant-numeric:tabular-nums;font-size:13px;color:#b6be69;min-height:24px}.note{font-size:14px}.hit{filter:brightness(0) invert(1)}a{color:#d4a04a}.error{color:#ed8e7c}</style>
<main><h1>물에 잠긴 사슬 주거구 · 몬스터 모션</h1><p>영웅과 공통 팔레트·큰 픽셀 덩어리·어두운 외곽선을 사용했습니다. 정지 기본 자세, 공격 한 가지, 기절 자세와 떨림을 확인할 수 있습니다. 피격은 흰색 점멸입니다.</p><div class="grid" id="actors"></div><p class="note">검수에서 제외한 프레임은 미리보기에 나오지 않습니다. 최종 전투 판정과 루트 이동은 게임이 처리하며, 이 화면은 원본 프레임만 보여줍니다. <a href="jobs.json">제작 이력</a> · <a href="review-decisions.json">프레임 검수 기록</a></p></main>
<script src="preview-data.js"></script><script>
const names={sewer_rat:'하수구 거대쥐',drowned_resident:'침수된 잔상',water_wraith:'물안개 망령'};
const descriptions={sewer_rat:'낮은 자세에서 이빨로 물기. 기절하면 앞다리가 꺾이고 턱이 바닥 가까이 내려갑니다.',drowned_resident:'집 문짝을 휘둘러 내려치기. 기절하면 고개와 양팔이 축 처집니다.',water_wraith:'등불을 감싸다가 손톱을 뻗어 찌르기. 기절하면 물빛 몸이 힘없이 아래로 접힙니다.'};
for(const actor of window.reviewActors||[]){
 const card=document.createElement('article');card.innerHTML='<h2>'+names[actor.id]+'</h2><div class="scene"><canvas width="128" height="96"></canvas></div><div class="buttons"></div><div class="frame"></div><p class="note">'+descriptions[actor.id]+'</p>';document.querySelector('#actors').append(card);
 const canvas=card.querySelector('canvas'),ctx=canvas.getContext('2d'),label=card.querySelector('.frame');ctx.imageSmoothingEnabled=false;
 let current='Idle',start=performance.now(),loaded=false;const sprites={};
 const loading=[];for(const [motion,clip]of Object.entries(actor.clips)){sprites[motion]=clip.frames.map(path=>{const im=new Image;loading.push(new Promise((ok,no)=>{im.onload=ok;im.onerror=()=>no(path);im.src=path}));return im})}
 for(const[motion,text]of[['Idle','기본'],['Attack','공격'],['Stun','기절'],['Hit','피격']]){const b=document.createElement('button');b.textContent=text;b.dataset.motion=motion;card.querySelector('.buttons').append(b);b.onclick=()=>{current=motion;start=performance.now();card.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));};if(motion==='Idle')b.classList.add('active')}
 Promise.all(loading).then(()=>{loaded=true}).catch(path=>{label.classList.add('error');label.textContent='이미지 로딩 실패: '+path});
 function render(now){if(loaded){const clip=actor.clips[current],total=clip.holds.reduce((a,b)=>a+b,0),elapsed=now-start;let t=current==='Attack'?elapsed%(total+900):elapsed%total;let frame=clip.holds.length-1;for(let i=0;i<clip.holds.length;i++){if(t<clip.holds[i]){frame=i;break}t-=clip.holds[i]}
 ctx.clearRect(0,0,128,96);ctx.drawImage(sprites[current][frame],0,0);canvas.classList.toggle('hit',current==='Hit'&&elapsed%900<120);label.textContent=current==='Idle'?'정지 기본 자세':current==='Hit'?'120ms 흰색 점멸':current+' · 원본 '+String(clip.sourceFrames[frame]).padStart(2,'0')+(frame===clip.contact?' · 접촉':'');}requestAnimationFrame(render)}requestAnimationFrame(render);
}
</script></html>
