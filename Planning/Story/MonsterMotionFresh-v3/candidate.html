const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const loaded={};
let actor=delivery.actors[0],motion='Attack',clip=null,index=0,elapsed=0,playing=false,last=performance.now(),repeatRest=0,hitPose=null;
for(const a of delivery.actors){const option=document.createElement('option');option.value=a.id;option.textContent=a.id;$('actor').append(option)}
const ready=Promise.all(Object.entries(sources).map(([key,src])=>new Promise(resolve=>{const img=new Image();img.onload=resolve;img.onerror=resolve;img.src=src;loaded[key]=img})));
function currentImage(){if(motion==='Hit')return hitPose||loaded[actor.base];if(!playing&&index<0)return loaded[actor.base];return loaded[clip.frames[Math.max(0,index)]]}
function draw(){ctx.clearRect(0,0,128,128);const img=currentImage();if(img&&img.complete)ctx.drawImage(img,0,0);if(motion==='Hit'&&playing){const alpha=elapsed<=45?1:Math.max(0,1-(elapsed-45)/75);ctx.globalCompositeOperation='source-atop';ctx.fillStyle=`rgba(255,255,255,${alpha})`;ctx.fillRect(0,0,128,128);ctx.globalCompositeOperation='source-over'}const contact=clip&&clip.contactFrame===index&&motion==='Attack';$('status').textContent=motion==='Hit'?`Hit · 45ms 흰색 + 75ms 복귀${playing?'':' · 종료'}`:index<0?`${motion} 종료 · 기본 자세`:`${motion} · ${index+1}/${clip.frames.length} · ${clip.frameDurationsMs[index]}ms${contact?' · 타격':''}`;$('seek').value=Math.max(0,index);$('play').textContent=playing?'일시정지':'재생';[...$('strip').children].forEach((b,i)=>b.classList.toggle('active',i===index))}
function buildStrip(){const box=$('strip');box.replaceChildren();if(motion==='Hit')return;clip.frames.forEach((file,i)=>{const b=document.createElement('button');b.innerHTML=`<img src="${sources[file]}" alt="">${i}${i===clip.contactFrame?' HIT':''} · ${clip.frameDurationsMs[i]}ms`;b.onclick=()=>step(i);box.append(b)})}
function select(name,start=true){if(!actor)return;if(name==='Hit')hitPose=currentImage();motion=name;clip=actor.clips.find(c=>c.motion===name);index=0;elapsed=0;repeatRest=0;playing=start;$('seek').max=clip.frames?clip.frames.length-1:0;for(const n of ['attack','hit','stun'])$(n).classList.toggle('active',n===name.toLowerCase());buildStrip();$('notes').textContent=actor.review?.notes||'생성 후보 검수 중';draw()}
function step(i){if(!clip.frames)return;index=(i+clip.frames.length)%clip.frames.length;elapsed=0;playing=false;draw()}
$('actor').onchange=()=>{actor=delivery.actors.find(a=>a.id===$('actor').value);hitPose=loaded[actor.base];select(motion,false)};
for(const name of ['Attack','Hit','Stun'])$(name.toLowerCase()).onclick=()=>select(name,true);
$('play').onclick=()=>{if(!playing&&index<0){index=0;elapsed=0}playing=!playing;last=performance.now();draw()};$('prev').onclick=()=>step(index-1);$('next').onclick=()=>step(index+1);$('seek').oninput=()=>step(Number($('seek').value));
function tick(now){const delta=Math.min(100,now-last)*Number($('speed').value);last=now;if(actor&&playing){if(motion==='Hit'){elapsed+=delta;if(elapsed>=120){playing=false;elapsed=120}}else if(index<0){repeatRest+=delta;if(repeatRest>=450){index=0;elapsed=0;repeatRest=0}}else{elapsed+=delta;while(playing&&index>=0&&elapsed>=clip.frameDurationsMs[index]){elapsed-=clip.frameDurationsMs[index];index++;if(index===clip.frames.length){if(clip.loop)index=0;else{index=-1;if(!$('repeat').checked)playing=false}}}}draw()}requestAnimationFrame(tick)}
ready.then(()=>{if(actor){clip=actor.clips.find(c=>c.motion==='Attack');select('Attack',false);index=-1;draw()}else{$('notes').textContent='검수가 완료된 몬스터가 여기에 순차 추가됩니다.'}requestAnimationFrame(tick)});
