<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>몬스터 모션 · Attack / Hit / Stun</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151c25;color:#e8edf5;font:15px system-ui,sans-serif}main{max-width:1040px;margin:24px auto;padding:18px}h1{font-size:23px;margin:0 0 8px}.muted{color:#9eafc3;font-size:13px}button,select{background:#263448;color:#edf3fb;border:1px solid #52657e;border-radius:7px;padding:9px 12px;font:inherit;cursor:pointer}button.active{background:#61502e;border-color:#ffd77a}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}label{display:flex;align-items:center;gap:6px}.layout{display:grid;grid-template-columns:400px 1fr;gap:24px}.stage{width:384px;height:384px;position:relative;background:#354252;border:1px solid #576b82;border-radius:12px;overflow:hidden}canvas{width:384px;height:384px;image-rendering:pixelated;display:block}.guide{pointer-events:none;position:absolute;left:0;right:0;top:342px;border-top:1px dashed #91a3b744}.guide:after{content:'+';position:absolute;left:229px;top:-12px;color:#fcd47e88}.strip{display:flex;flex-wrap:wrap;gap:5px;max-height:330px;overflow:auto}.strip button{width:80px;padding:3px;font-size:11px}.strip img{width:72px;height:72px;image-rendering:pixelated}#status{color:#ffd77a;font-variant-numeric:tabular-nums;min-height:24px}#notes{line-height:1.6;white-space:pre-wrap}.seek{width:100%;accent-color:#ffd77a}.pending{padding:30px}@media(max-width:780px){.layout{grid-template-columns:1fr}.stage{max-width:100%}}
</style><main><h1>몬스터 모션</h1><div class="muted">기본 그림은 정지 상태로 표시합니다. 제공 모션: Attack · Hit · Stun</div>
<div class="controls"><label>몬스터 <select id="actor"></select></label><button id="attack">Attack</button><button id="hit">Hit</button><button id="stun">Stun</button><label>속도 <select id="speed"><option value="1">1× 정상</option><option value="0.5">0.5× 느리게</option><option value="0.25">0.25× 상세</option></select></label></div>
<div class="layout"><div><div class="stage"><canvas id="canvas" width="128" height="128"></canvas><div class="guide"></div></div><div class="controls"><button id="play">재생</button><button id="prev">이전</button><button id="next">다음</button><label><input type="checkbox" id="repeat">공격 반복 확인</label></div><input class="seek" id="seek" type="range" min="0" max="0" value="0"><div id="status"></div></div><div><div id="strip" class="strip"></div><p id="notes" class="muted"></p></div></div>
<details id="audio-review" open><summary>소리 미리보기 · 공격음 / 낮은 종 / 배경음악</summary><div id="sound-controls"></div></details>
</main><script src="Audio-v4/preview-audio.js?v=clash1"></script><script>
const delivery=__DELIVERY__, sources=__IMAGES__;
const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const loaded={};
let actor=delivery.actors[0],motion='Attack',clip=null,index=0,elapsed=0,playing=false,last=performance.now(),repeatRest=0,hitPose=null;
for(const a of delivery.actors){const option=document.createElement('option');option.value=a.id;option.textContent=a.id;$('actor').append(option)}
const ready=Promise.all(Object.entries(sources).map(([key,src])=>new Promise(resolve=>{const img=new Image();img.onload=resolve;img.onerror=resolve;img.src=src;loaded[key]=img})));
function currentImage(){if(motion==='Hit')return hitPose||loaded[actor.base];if(!playing&&index<0)return loaded[actor.base];return loaded[clip.frames[Math.max(0,index)]]}
function draw(){ctx.clearRect(0,0,128,128);const img=currentImage();if(img&&img.complete)ctx.drawImage(img,0,0);if(motion==='Hit'&&playing){const alpha=elapsed<=45?1:Math.max(0,1-(elapsed-45)/75);ctx.globalCompositeOperation='source-atop';ctx.fillStyle=`rgba(255,255,255,${alpha})`;ctx.fillRect(0,0,128,128);ctx.globalCompositeOperation='source-over'}const contact=clip&&clip.contactFrame===index&&motion==='Attack';$('status').textContent=motion==='Hit'?`Hit · 45ms 흰색 + 75ms 복귀${playing?'':' · 종료'}`:index<0?`${motion} 종료 · 기본 자세`:`${motion} · ${index+1}/${clip.frames.length} · ${clip.frameDurationsMs[index]}ms${contact?' · 타격':''}`;$('seek').value=Math.max(0,index);$('play').textContent=playing?'일시정지':'재생';[...$('strip').children].forEach((b,i)=>b.classList.toggle('active',i===index))}
function buildStrip(){const box=$('strip');box.replaceChildren();if(motion==='Hit')return;clip.frames.forEach((file,i)=>{const b=document.createElement('button');b.innerHTML=`<img src="${sources[file]}" alt="">${i}${i===clip.contactFrame?' HIT':''} · ${clip.frameDurationsMs[i]}ms`;b.onclick=()=>step(i);box.append(b)})}
function select(name,start=true){if(!actor)return;window.LastBellAudio?.stopSfx();if(name==='Hit'&&start)window.LastBellAudio?.play('hit-sharp');if(name==='Hit')hitPose=currentImage();motion=name;clip=actor.clips.find(c=>c.motion===name);index=0;elapsed=0;repeatRest=0;playing=start;$('seek').max=clip.frames?clip.frames.length-1:0;for(const n of ['attack','hit','stun'])$(n).classList.toggle('active',n===name.toLowerCase());buildStrip();$('notes').textContent=actor.review?.notes||'생성 후보 검수 중';draw()}
function step(i){if(!clip.frames)return;window.LastBellAudio?.stopSfx();index=(i+clip.frames.length)%clip.frames.length;elapsed=0;playing=false;draw()}
$('actor').onchange=()=>{actor=delivery.actors.find(a=>a.id===$('actor').value);hitPose=loaded[actor.base];window.LastBellAudio?.setMood(['bell_knight','chain_jailer','gate_lock','pendulum_warden'].includes(actor.id)?'bgm-boss':['chain_puppet','hook_hound','chain_dancer'].includes(actor.id)?'bgm-quarter':'bgm-road');select(motion,false)};
for(const name of ['Attack','Hit','Stun'])$(name.toLowerCase()).onclick=()=>select(name,true);
$('play').onclick=()=>{if(!playing&&index<0){index=0;elapsed=0}playing=!playing;if(!playing)window.LastBellAudio?.stopSfx();last=performance.now();draw()};$('prev').onclick=()=>step(index-1);$('next').onclick=()=>step(index+1);$('seek').oninput=()=>step(Number($('seek').value));
function tick(now){const delta=Math.min(100,now-last)*Number($('speed').value);last=now;if(actor&&playing){if(motion==='Hit'){elapsed+=delta;if(elapsed>=120){playing=false;elapsed=120}}else if(index<0){repeatRest+=delta;if(repeatRest>=450){index=0;elapsed=0;repeatRest=0}}else{elapsed+=delta;while(playing&&index>=0&&elapsed>=clip.frameDurationsMs[index]){elapsed-=clip.frameDurationsMs[index];index++;if(motion==='Attack'&&index===clip.contactFrame)window.LastBellAudio?.play('sword-clash');if(index===clip.frames.length){if(clip.loop)index=0;else{index=-1;if(!$('repeat').checked)playing=false}}}}draw()}requestAnimationFrame(tick)}
ready.then(()=>{if(actor){clip=actor.clips.find(c=>c.motion==='Attack');select('Attack',false);index=-1;draw()}else{$('notes').textContent='검수가 완료된 몬스터가 여기에 순차 추가됩니다.'}requestAnimationFrame(tick)});
</script></html>
